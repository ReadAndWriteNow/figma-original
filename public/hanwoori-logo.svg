         C 39,95 38,88 44,80
         C 48,74 44,68 34,66
         C 20,62 14,48 16,36
         C 18,26 24,22 32,20 Z

         M 34,38
         C 42,28 58,26 70,34
         C 78,42 78,54 72,64
         C 66,74 56,74 50,66
         C 44,58 36,56 28,50
         C 26,44 28,40 34,38 Z"
    />
  </g>

  <!-- Right: Typography ('한우리' + '독서토론논술') -->
  <text x="125" y="74" class="hw-txt-main" font-size="52" letter-spacing="-2px">
    한우리
  </text>
  <text x="280" y="72" class="hw-txt-sub" font-size="34" letter-spacing="-1px">
