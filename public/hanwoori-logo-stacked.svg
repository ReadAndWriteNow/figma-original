<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="hwEmblemGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FA5C24" />
      <stop offset="100%" stopColor="#E24810" />
    </linearGradient>
    <filter id="hwShadowV" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#E24810" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Top Center: Hanwoori Emblem -->
  <g transform="translate(160, 56)" filter="url(#hwShadowV)">
    <path
      d="M 0,-44 
         C 24.3,-44 44,-24.3 44,0 
         C 44,18.5 32.5,33.5 16.5,40.5 
         C 10.5,43.2 4.5,47.5 1.5,51 
         C -0.2,53 -2.8,52.8 -3.8,50.2 
         C -6.8,42.5 -13.5,38 -20.5,35 
         C -34.5,29 -44,15.5 -44,0 
         C -44,-24.3 -24.3,-44 0,-44 Z"
      fill="url(#hwEmblemGradV)"
    />
    <path
      d="M 0,-30 
         C 16.5,-30 29.5,-17 29.5,0 
         C 29.5,11.5 21,21 11,26 
         C 6,28.5 0.5,33.5 -1,36.5 
         C -2,34.5 -4.5,31.5 -7,28.5 
         C -16.5,22.5 -23.5,12.5 -23.5,0 
         C -23.5,-17 -13,-30 0,-30 Z"
      fill="#FFFFFF"
    />
    <circle cx="2.5" cy="-3.5" r="10.5" fill="url(#hwEmblemGradV)" />
    <path
      d="M -5.5,7 C -0.5,12.5 7.5,12.5 12.5,7"
      stroke="url(#hwEmblemGradV)"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Bottom: Typography without SINCE 1990 -->
  <g fill="#0F243B" transform="translate(160, 146)">
    <text
      font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"
      font-size="34"
      letter-spacing="-1.5px"
      text-anchor="middle"
    >
      <tspan font-weight="900" fill="#0F243B">한우리</tspan><tspan font-weight="700" fill="#132F4C">독서토론논술</tspan>
    </text>
  </g>
</svg>
